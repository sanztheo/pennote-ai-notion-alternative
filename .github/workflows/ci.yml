name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 1: Quality Gate
  # ============================================
  quality-gate:
    name: "Quality Gate (${{ matrix.project }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pen-frontend, pen-backend]
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_SUBMODULES }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Generate Prisma clients (backend only)
        if: matrix.project == 'pen-backend'
        run: npx prisma generate && npx prisma generate --schema=prisma/schema-embeddings.prisma
        working-directory: ${{ matrix.project }}

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: ${{ matrix.project }}

      - name: ESLint (errors block PR)
        run: npm run lint:errors
        working-directory: ${{ matrix.project }}

      - name: ESLint (warnings displayed)
        if: always()
        run: npm run lint || true
        working-directory: ${{ matrix.project }}

      - name: Prettier check
        run: npm run format:check
        working-directory: ${{ matrix.project }}

  # ============================================
  # STAGE 2: Build
  # ============================================
  build:
    name: "Build (${{ matrix.project }})"
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pen-frontend, pen-backend]
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_SUBMODULES }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Generate Prisma clients (backend only)
        if: matrix.project == 'pen-backend'
        run: npx prisma generate && npx prisma generate --schema=prisma/schema-embeddings.prisma
        working-directory: ${{ matrix.project }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.project }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_API_URL: https://placeholder.api.com
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_PADDLE_CLIENT_TOKEN: test_placeholder
          VITE_PADDLE_ENVIRONMENT: sandbox

  # ============================================
  # STAGE 3: Unit Tests
  # ============================================
  unit-tests-backend:
    name: "Unit Tests (backend)"
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_SUBMODULES }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pen-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: pen-backend

      - name: Generate Prisma clients
        run: npx prisma generate && npx prisma generate --schema=prisma/schema-embeddings.prisma
        working-directory: pen-backend

      - name: Run Jest tests
        # TODO: Remove testPathIgnorePatterns once preprocessor tests are fixed
        run: npm test -- --ci --testPathIgnorePatterns="node_modules" --testPathIgnorePatterns="dist" --testPathIgnorePatterns="preprocessor/__tests__/(QuizPreprocessorAgent|limitValidator|integrationHelper)"
        working-directory: pen-backend
        env:
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          OPENAI_API_KEY: sk-test-key
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: pen-backend/coverage/
          retention-days: 7

  unit-tests-frontend:
    name: "Unit Tests (frontend)"
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_SUBMODULES }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pen-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: pen-frontend

      - name: Run Vitest tests
        run: npm test -- --reporter=verbose
        working-directory: pen-frontend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: pen-frontend/coverage/
          retention-days: 7

  # ============================================
  # STAGE 4: E2E Tests (public pages only in CI)
  # ============================================
  e2e-tests:
    name: "E2E Tests (Playwright)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_SUBMODULES }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pen-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: pen-frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: pen-frontend

      - name: Run Playwright tests (public pages)
        run: npx playwright test --project=public --project=chromium
        working-directory: pen-frontend
        env:
          CI: true
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pen-frontend/playwright-report/
          retention-days: 7

      - name: Upload test screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: pen-frontend/test-results/
          retention-days: 7

  # ============================================
  # STAGE 5: Security Audit
  # ============================================
  security:
    name: "Security Audit (${{ matrix.project }})"
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [pen-frontend, pen-backend]
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_SUBMODULES }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical || true
        working-directory: ${{ matrix.project }}

  # ============================================
  # Final Status Check (branch protection target)
  # ============================================
  ci-status:
    name: "CI Status"
    if: always()
    needs:
      - quality-gate
      - build
      - unit-tests-backend
      - unit-tests-frontend
      - e2e-tests
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pipeline result
        env:
          QUALITY_GATE: ${{ needs.quality-gate.result }}
          BUILD: ${{ needs.build.result }}
          TESTS_BACKEND: ${{ needs.unit-tests-backend.result }}
          TESTS_FRONTEND: ${{ needs.unit-tests-frontend.result }}
          E2E: ${{ needs.e2e-tests.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          echo "Quality Gate: $QUALITY_GATE"
          echo "Build: $BUILD"
          echo "Backend Tests: $TESTS_BACKEND"
          echo "Frontend Tests: $TESTS_FRONTEND"
          echo "E2E Tests: $E2E"
          echo "Security: $SECURITY"

          if [[ "$QUALITY_GATE" == "failure" ]] || \
             [[ "$BUILD" == "failure" ]] || \
             [[ "$TESTS_BACKEND" == "failure" ]] || \
             [[ "$TESTS_FRONTEND" == "failure" ]] || \
             [[ "$E2E" == "failure" ]]; then
            echo ""
            echo "CI Pipeline FAILED"
            exit 1
          fi
          echo ""
          echo "CI Pipeline PASSED"
